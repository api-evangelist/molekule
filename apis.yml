apis:
- name: Molekule Agent Commerce (UCP / MCP)
  description: >-
    Agent-driven commerce surface for the Molekule storefront implementing the
    Universal Commerce Protocol over MCP. Agents discover capabilities at
    /.well-known/ucp, then search the catalog, build a cart, and drive a
    buyer-approved checkout via the MCP endpoint. Buyer identity uses the
    Shopify Customer Account API (OIDC).
