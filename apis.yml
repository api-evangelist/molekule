name: Molekule
description: >-
  Molekule is a consumer air-quality hardware company that makes FDA-cleared
  HEPA air purifiers for homes and businesses. It sells direct-to-consumer
  through molekule.com, a Shopify-hosted storefront. While Molekule does not
  publish a traditional developer API, its store exposes a live agent-commerce
  surface: a Universal Commerce Protocol (UCP) merchant profile at
  /.well-known/ucp, a Model Context Protocol (MCP) endpoint at /api/ucp/mcp for
  AI shopping agents, OpenID Connect buyer authentication via the Shopify
  Customer Account API, and published agent instructions at /agents.md and
  /llms.txt. This profile captures that machine-readable commerce surface for
  the API Evangelist network.
